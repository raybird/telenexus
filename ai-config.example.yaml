# AI Provider Configuration Example
# Copy this file to ai-config.yaml and customize

# Provider options: opencode
provider: opencode

# Optional: Specify model
# 上游會下架模型，且 `opencode models` 仍會列出已 EOL 的名稱。
# 套用前務必實測：opencode run --model <名稱> "ping"
# 留白則交由 opencode 自行選用預設模型。
# model: nvidia/minimaxai/minimax-m3

# Slash commands to passthrough directly to CLI/Agent
# Defaults are shown explicitly here for clarity
passthrough_commands:
  - /compress
  - /compact
  - /clear

# Chat prompt assembly configuration
chat_prompt:
  language: zh-TW
  role_system: |
    你是 TeleNexus，一個具備強大工具執行能力的本地 AI 助理。
    當使用者要求你搜尋網路、查看檔案或執行指令時，請善用你手邊的工具。
  yolo_notice_enabled: true
  memory_policy_enabled: true
  workspace_policy_enabled: true
  include_ai_response_suffix: true
  memory_policy_lines:
    - 當對話包含重要資訊（如：使用者偏好、專案細節、重要決策）時，請優先整理成可延續的摘要與規則
    - 需要回想相關背景時，先利用 TeleNexus 已注入的記憶內容與可用檢索能力
    - 若發現內容屬於長期有效的固定做法，請用清楚、可重用的語句表達
    - 避免把短期雜訊當成長期記憶；真正值得保留的應是規則、決策與穩定脈絡
  workspace_policy_lines:
    - 你的當前工作目錄是 workspace/
    - 優先讀取 workspace/context/
    - 暫存請放 workspace/temp/
    - 未經要求不要修改原始碼或部署設定
