# ==========================================================================
# TeleNexus release compose — 使用 GHCR 預建映像,不在使用者端建置。
# 此檔為 release bundle 的 docker-compose.yml 範本:
# CI 打包時會把 `:latest` 釘成該次發佈的 `:vX.Y.Z` 再放進 bundle。
# 與開發版 docker-compose.yml 的唯一差異是 build: → image:。
# ==========================================================================

x-common-config: &common-config
  image: ghcr.io/raybird/telenexus:latest
  env_file: .env
  restart: unless-stopped
  # 降權:禁止透過 setuid 提權,並丟棄所有 Linux capabilities，
  # 只保留 entrypoint 做 runtime UID 對齊 (usermod/chown) 與 gosu 降權所需的最小集合。
  # gosu 是「降權」不是提權,與 no-new-privileges 相容。
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - FOWNER
    - DAC_OVERRIDE
  volumes:
    - ./data:/app/data
    - ./workspace:/app/workspace
    - ./ai-config.yaml:/app/ai-config.yaml:ro
    # opencode 認證儲存：容器內獨立 named volume，不讀 host ~/.local/share/opencode
    - opencode_auth:/home/node/.local/share/opencode
    # opencode 全域設定 (含 agent 內部安裝的 skill)：持久化，重建不消失
    - opencode_config:/home/node/.config/opencode
    - ./skills:/app/skills:ro
    - ./AGENTS.md:/app/workspace/AGENTS.md:ro

x-common-env: &common-env
  TZ: Asia/Taipei
  # runtime UID/GID 對齊 (entrypoint 讀取後 remap node 使用者再 gosu 降權)
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  DB_PATH: /app/data/moltbot.db
  DB_DIR: /app/data
  APP_PROJECT_DIR: /app
  RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-}
  # Memoria 是遠端 HTTP 服務:telenexus 是純 client,recall 與 sync 都走 MEMORIA_ENDPOINT
  MEMORIA_SYNC_ENABLED: ${MEMORIA_SYNC_ENABLED:-auto}
  MEMORIA_ENDPOINT: ${MEMORIA_ENDPOINT:-http://memoria:3917}
  MEMORIA_SYNC_TIMEOUT_MS: ${MEMORIA_SYNC_TIMEOUT_MS:-20000}
  MEMORIA_HOOK_QUEUE_ENABLED: ${MEMORIA_HOOK_QUEUE_ENABLED:-true}
  MEMORIA_HOOK_QUEUE_FILE: ${MEMORIA_HOOK_QUEUE_FILE:-/app/data/memoria-hook-queue.jsonl}
  MEMORIA_HOOK_FLUSH_SIGNAL: ${MEMORIA_HOOK_FLUSH_SIGNAL:-/app/data/memoria-hook-flush.signal}
  MEMORIA_HOOK_QUEUE_POLL_MS: ${MEMORIA_HOOK_QUEUE_POLL_MS:-5000}
  # opencode 全自動放行：預設開 (1)，可在 .env 設 OPENCODE_YOLO=0 收緊
  OPENCODE_YOLO: ${OPENCODE_YOLO:-1}
  # builtin skills 同步目標：專案層 (保證載入) + 全域層 (seed 持久化全域設定)
  OPENCODE_SKILLS_DIRS: ${OPENCODE_SKILLS_DIRS:-/app/workspace/.opencode/skills,/home/node/.config/opencode/skills}
  # 非 root 執行 chromium 必須 --no-sandbox；agent-browser 讀此 env 套用啟動參數
  AGENT_BROWSER_ARGS: ${AGENT_BROWSER_ARGS:---no-sandbox,--disable-dev-shm-usage}

services:
  telenexus:
    <<: *common-config
    environment:
      <<: *common-env
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      WEB_BIND: ${WEB_BIND:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-3030}
      WEB_AUTH_TOKEN: ${WEB_AUTH_TOKEN:-}
      WEB_TRUST_PRIVATE_NETWORK: ${WEB_TRUST_PRIVATE_NETWORK:-false}
      WEB_ALERT_ERROR_THRESHOLD: ${WEB_ALERT_ERROR_THRESHOLD:-1}
      WEB_ALERT_RUNNER_SUCCESS_WARN_THRESHOLD: ${WEB_ALERT_RUNNER_SUCCESS_WARN_THRESHOLD:-80}
      WEB_USER_ID: ${WEB_USER_ID:-}
      RUNNER_ENDPOINT: ${RUNNER_ENDPOINT:-}
      SCHEDULE_USE_RUNNER: ${SCHEDULE_USE_RUNNER:-true}
      CHAT_USE_RUNNER_PERCENT: ${CHAT_USE_RUNNER_PERCENT:-100}
      CHAT_USE_RUNNER_ONLY_USERS: ${CHAT_USE_RUNNER_ONLY_USERS:-}
      RUNNER_FAILURE_THRESHOLD: ${RUNNER_FAILURE_THRESHOLD:-3}
      RUNNER_COOLDOWN_MS: ${RUNNER_COOLDOWN_MS:-60000}
      MEMORIA_RECALL_ENABLED: ${MEMORIA_RECALL_ENABLED:-auto}
      MEMORIA_RECALL_TIMEOUT_MS: ${MEMORIA_RECALL_TIMEOUT_MS:-1500}
      MEMORIA_RECALL_TOP_K: ${MEMORIA_RECALL_TOP_K:-5}
    ports:
      - ${WEB_PORT:-3030}:${WEB_PORT:-3030}
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  agent-runner:
    <<: *common-config
    environment:
      <<: *common-env
      RUNNER_MODE: standalone
      RUNNER_PORT: 8787
    command: [ 'node', 'dist/runner.js' ]
    # 失控時的安全邊界,不是 browser cleanup 的替代品 —— cleanup 修在
    # process-runner.ts / cli-agent-base.ts 的 process group 終止。
    # 上限抓在實測 peak (1.48GB) 之上而非貼齊,留給正常的 Chrome 尖峰;
    # 太貼近 peak 會把正常互動變成 OOMKilled。
    mem_limit: 2g
    mem_reservation: 512m
    # 一棵 Chrome tree 約 180+ threads,cgroup pids 是 task 數(含 threads)。
    # 實測 idle 221、工作中更高,384 會太緊,先給 1024 再依實測收斂。
    pids_limit: 1024
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  memoria:
    image: ghcr.io/raybird/telenexus-memoria:latest
    environment:
      MEMORIA_HOME: /data
      MEMORIA_PORT: 3917
    volumes:
      # 記憶資料走 named volume,不用 host bind mount
      - memoria_data:/data
    restart: unless-stopped
    # memoria 的可寫面很小 (只有 /data volume),可上完整 read-only rootfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:3917/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode_auth:
  opencode_config:
  memoria_data:
