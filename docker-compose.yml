x-common-config: &common-config
  build:
    context: .
    args:
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
  env_file: .env
  init: true
  restart: unless-stopped
  # 降權:禁止透過 setuid 提權,並丟棄所有 Linux capabilities，
  # 只保留 entrypoint 做 runtime UID 對齊 (usermod/chown) 與 gosu 降權所需的最小集合。
  # gosu 是「降權」不是提權,與 no-new-privileges 相容。
  # KILL:以 root 執行的 init (tini) 要把 SIGTERM 轉給降權後的主程序，沒有它 docker stop 時
  # tini 回報 Operation not permitted 並直接結束，優雅關閉不會執行（issue 0031）。
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - FOWNER
    - DAC_OVERRIDE
    - KILL
  volumes:
    - ./data:/app/data
    - ./workspace:/app/workspace
    - ./ai-config.yaml:/app/ai-config.yaml:ro
    # opencode 認證儲存：容器內獨立 named volume，不讀 host ~/.local/share/opencode
    - opencode_auth:/home/node/.local/share/opencode
    # opencode 全域設定 (含 agent 內部安裝的 skill)：持久化，重建不消失
    - opencode_config:/home/node/.config/opencode
    - ./skills:/app/skills:ro
    - ./AGENTS.md:/app/workspace/AGENTS.md:ro

x-common-env: &common-env
  TZ: Asia/Taipei
  # runtime UID/GID 對齊 (entrypoint 讀取後 remap node 使用者再 gosu 降權)
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  DB_PATH: /app/data/moltbot.db
  DB_DIR: /app/data
  APP_PROJECT_DIR: /app
  RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-}
  # Memoria 已改為遠端 HTTP 服務:telenexus 是純 client,recall 與 sync 都走 MEMORIA_ENDPOINT
  # (見各 service 的 MEMORIA_ENDPOINT)。不再需要 MEMORIA_HOME / MEMORIA_CLI_PATH。
  MEMORIA_SYNC_ENABLED: ${MEMORIA_SYNC_ENABLED:-auto}
  MEMORIA_ENDPOINT: ${MEMORIA_ENDPOINT:-http://memoria:3917}
  MEMORIA_SYNC_TIMEOUT_MS: ${MEMORIA_SYNC_TIMEOUT_MS:-20000}
  MEMORIA_HOOK_QUEUE_ENABLED: ${MEMORIA_HOOK_QUEUE_ENABLED:-true}
  MEMORIA_HOOK_QUEUE_FILE: ${MEMORIA_HOOK_QUEUE_FILE:-/app/data/memoria-hook-queue.jsonl}
  MEMORIA_HOOK_FLUSH_SIGNAL: ${MEMORIA_HOOK_FLUSH_SIGNAL:-/app/data/memoria-hook-flush.signal}
  MEMORIA_HOOK_QUEUE_POLL_MS: ${MEMORIA_HOOK_QUEUE_POLL_MS:-5000}
  # opencode 全自動放行：預設開 (1)，可在 .env 設 OPENCODE_YOLO=0 收緊
  OPENCODE_YOLO: ${OPENCODE_YOLO:-1}
  # builtin skills 同步目標：專案層 (保證載入) + 全域層 (seed 持久化全域設定)
  OPENCODE_SKILLS_DIRS: ${OPENCODE_SKILLS_DIRS:-/app/workspace/.opencode/skills,/home/node/.config/opencode/skills}

services:
  telenexus:
    <<: *common-config
    environment:
      <<: *common-env
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ALLOWED_USER_ID: ${ALLOWED_USER_ID}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      WEB_BIND: ${WEB_BIND:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-3030}
      WEB_AUTH_TOKEN: ${WEB_AUTH_TOKEN:-}
      WEB_TRUST_PRIVATE_NETWORK: ${WEB_TRUST_PRIVATE_NETWORK:-false}
      WEB_ALERT_ERROR_THRESHOLD: ${WEB_ALERT_ERROR_THRESHOLD:-1}
      WEB_ALERT_RUNNER_SUCCESS_WARN_THRESHOLD: ${WEB_ALERT_RUNNER_SUCCESS_WARN_THRESHOLD:-80}
      WEB_USER_ID: ${WEB_USER_ID:-}
      RUNNER_ENDPOINT: ${RUNNER_ENDPOINT:-}
      SCHEDULE_USE_RUNNER: ${SCHEDULE_USE_RUNNER:-true}
      CHAT_USE_RUNNER_PERCENT: ${CHAT_USE_RUNNER_PERCENT:-100}
      CHAT_USE_RUNNER_ONLY_USERS: ${CHAT_USE_RUNNER_ONLY_USERS:-}
      RUNNER_FAILURE_THRESHOLD: ${RUNNER_FAILURE_THRESHOLD:-3}
      RUNNER_COOLDOWN_MS: ${RUNNER_COOLDOWN_MS:-60000}
      MEMORIA_RECALL_ENABLED: ${MEMORIA_RECALL_ENABLED:-auto}
      MEMORIA_RECALL_MODE: ${MEMORIA_RECALL_MODE:-vector}
      MEMORIA_RECALL_TIMEOUT_MS: ${MEMORIA_RECALL_TIMEOUT_MS:-}
      MEMORIA_RECALL_TOP_K: ${MEMORIA_RECALL_TOP_K:-5}
      # issue 0030：模型面板。只在容器網路上聽 3040，不對主機開放；公開網址由 tunnel-manager 按需建立。
      PANEL_ENABLED: ${PANEL_ENABLED:-true}
      PANEL_BIND: 0.0.0.0
      PANEL_PORT: '3040'
      TUNNEL_MANAGER_URL: http://tunnel-manager:8790
      TUNNEL_KEY_FILE: /run/telenexus-tunnel/key
    # 自己列 volumes 會蓋掉共用清單，所以共用的掛載要全部重列（tests/docker/tunnel-manager-compose.test.ts 檢查）
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./ai-config.yaml:/app/ai-config.yaml:ro
      - opencode_auth:/home/node/.local/share/opencode
      - opencode_config:/home/node/.config/opencode
      - ./skills:/app/skills:ro
      - ./AGENTS.md:/app/workspace/AGENTS.md:ro
      - tunnel_key:/run/telenexus-tunnel:ro
    ports:
      - ${WEB_PORT:-3030}:${WEB_PORT:-3030}
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  agent-runner:
    <<: *common-config
    environment:
      <<: *common-env
      RUNNER_MODE: standalone
      RUNNER_PORT: 8787
    command: [ 'node', 'dist/runner.js' ]
    # 失控時的安全邊界,不是 browser cleanup 的替代品 —— cleanup 修在
    # process-runner.ts / cli-agent-base.ts 的 process group 終止。
    # 上限抓在實測 peak (1.48GB) 之上而非貼齊,留給正常的 Chrome 尖峰;
    # 太貼近 peak 會把正常互動變成 OOMKilled。
    mem_limit: 2g
    mem_reservation: 512m
    # 一棵 Chrome tree 約 180+ threads,cgroup pids 是 task 數(含 threads)。
    # 實測 idle 221、工作中更高,384 會太緊,先給 1024 再依實測收斂。
    pids_limit: 1024
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # issue 0030：按需啟停 Cloudflare Quick Tunnel，只接 telenexus 的面板連接埠。
  # 它是唯一能開公開網址的容器，所以邊界最窄：不讀 .env（有 Bot Token）、不掛 data、
  # 沒有 ports:（內部 API 只在容器網路上，以 tunnel_key volume 裡的金鑰認證）。
  # cap_add 與其他服務相同：前五項給 entrypoint 對齊 PUID/PGID 用，KILL 讓 init（tini）把 SIGTERM
  # 轉給非 root 的主程序，cloudflared 才能正常收尾（2026-11-17 實測：沒有 KILL 時 tini 回報 Operation not permitted、exit 1）。
  tunnel-manager:
    build:
      context: .
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    command: [ 'node', 'dist/tunnel-manager.js' ]
    environment:
      TZ: Asia/Taipei
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TUNNEL_KEY_FILE: /run/telenexus-tunnel/key
      TUNNEL_API_HOST: 0.0.0.0
      TUNNEL_API_PORT: '8790'
      TUNNEL_TARGET_URL: http://telenexus:3040
    volumes:
      - tunnel_key:/run/telenexus-tunnel
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      # 內部 API 沒帶金鑰一律 401；回 401 就代表服務在線
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:8790/tunnel/status').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  memoria:
    build:
      context: ./docker
      dockerfile: memoria.Dockerfile
    environment:
      MEMORIA_HOME: /data
      MEMORIA_PORT: 3917
      MEMORIA_VECTOR_ENABLED: ${MEMORIA_VECTOR_ENABLED:-1}
      MEMORIA_VECTOR_TIMEOUT_MS: ${MEMORIA_VECTOR_TIMEOUT_MS:-15000}
      MEMORIA_VECTOR_MAX_DISTANCE: ${MEMORIA_VECTOR_MAX_DISTANCE:-}
      MEMORIA_VECTOR_SYNC_INTERVAL_MS: ${MEMORIA_VECTOR_SYNC_INTERVAL_MS:-60000}
      MEMORIA_EMBED_BATCH: ${MEMORIA_EMBED_BATCH:-2}
      MEMORIA_VECTOR_BATCH_PAUSE_MS: ${MEMORIA_VECTOR_BATCH_PAUSE_MS:-1000}
    init: true
    cpus: 0.5
    mem_limit: 4g
    volumes:
      # 記憶資料走 named volume,不再用 source checkout 當資料目錄
      - memoria_data:/data
    restart: unless-stopped
    # memoria 的可寫面很小 (只有 /data volume),可上完整 read-only rootfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:3917/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Linux host network preserves Memoria UI's built-in 127.0.0.1-only binding.
  memoria-ui:
    profiles: [ 'memory-ui' ]
    build:
      context: ./docker
      dockerfile: memoria.Dockerfile
    network_mode: host
    command: [ 'memoria', 'serve', '--ui' ]
    environment:
      MEMORIA_HOME: /data
      MEMORIA_PORT: ${MEMORIA_UI_PORT:-3918}
      MEMORIA_VECTOR_ENABLED: '0'
    volumes:
      - memoria_data:/data
    depends_on:
      memoria:
        condition: service_healthy
    init: true
    cpus: 0.25
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:'+process.env.MEMORIA_PORT+'/ui/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode_auth:
  opencode_config:
  memoria_data:
  tunnel_key:
