# Model Registry — NVIDIA NIM 可用模型清單
# 格式：model_id|tier|notes
# tier: S / A / B / C
# 更新日期：2026-05-27（執行 assess-models.sh 後視結果更新）
#
# 注意：以下 model_id 為當時快照，會隨供應商上下架而過時。
#       SKILL.md 的「角色↔模型」對應只是非綁定建議；角色分工不依賴特定型號。
#       NIM 清單有異動時請重跑 assess-models.sh 更新本檔。
#
# tier 定義：
#   S = 旗艦級，適合最複雜任務
#   A = 強力推薦，均衡性能
#   B = 可用，特定場景佳
#   C = 輕量 / 特殊用途

# ── OpenCode 平台自有免費模型（opencode models opencode）──
opencode/big-pickle|A|3/3 通過，T3 正確(8)，T2 輸出含 python3 -c 包裝（輕微格式問題）
opencode/deepseek-v4-flash-free|A|3/3 全通過，T3 正確(8)，輸出最乾淨，推薦優先使用
opencode/nemotron-3-super-free|B|2/3，T1 回應空白（疑似過濾），T2/T3 正確(8)，程式碼能力佳

