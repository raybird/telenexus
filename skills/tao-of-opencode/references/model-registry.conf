nvidia/deepseek-ai/deepseek-v4-pro|S|三維全滿分，推理最穩定，程式碼強
nvidia/qwen/qwen3.5-397b-a17b|S|超大參數，知識廣博
nvidia/qwen/qwen3-coder-480b-a35b-instruct|S|最強程式碼生成，T3 有 0-index 偏差
nvidia/moonshotai/kimi-k2.6|S|能力強但偶發 timeout，需監控

