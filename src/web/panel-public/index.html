<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>模型設定</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1 id="title">模型設定</h1>

      <section class="current" aria-labelledby="current-heading">
        <h2 id="current-heading">目前設定</h2>
        <dl>
          <dt>有效模型</dt>
          <dd><code id="current-model">讀取中…</code></dd>
          <dt>來源</dt>
          <dd id="current-source">—</dd>
        </dl>
      </section>

      <p class="notice">
        這是<strong>全域設定</strong>：之後新的聊天與排程都會用選定的模型，正在進行的任務不受影響。
        清單來自 <code>opencode models</code>，<strong>列出不代表可以呼叫</strong>，認證與額度沒有經過測試。
      </p>

      <form id="model-form" aria-labelledby="pick-heading" novalidate>
        <h2 id="pick-heading">選擇模型</h2>

        <search class="filters">
          <div class="field">
            <label for="provider">供應商</label>
            <select id="provider" name="provider">
              <option value="">全部</option>
            </select>
          </div>
          <div class="field">
            <label for="query">搜尋模型</label>
            <input
              id="query"
              name="query"
              type="search"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="search"
            />
          </div>
        </search>

        <fieldset>
          <legend>模型（完整 ID）<span id="count"></span></legend>
          <div id="models" class="models"></div>
          <p id="empty" class="empty" hidden></p>
        </fieldset>

        <div class="actions">
          <button id="apply" type="submit">套用選定的模型</button>
          <button id="reset" type="button">恢復預設</button>
          <button id="refresh" type="button">重新整理清單</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
