<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeleNexus Web Console</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

      :root {
        --bg: #edf3fb;
        --bg-glow: #dbeafe;
        --panel: #ffffff;
        --panel-soft: #f8fbff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #d8e1ec;
        --line-strong: #c8d4e4;
        --primary: #0f766e;
        --primary-strong: #115e59;
        --sidebar-bg: #f3f8ff;
        --danger-bg: #fee2e2;
        --danger-text: #991b1b;
        --warn-bg: #ffedd5;
        --warn-text: #9a3412;
        --shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--text);
        font-family:
          'Fira Sans',
          'Noto Sans TC',
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(1200px 600px at 90% -10%, var(--bg-glow), transparent), var(--bg);
      }

      .wrap {
        max-width: 1360px;
        margin: 16px auto;
        padding: 0 12px;
      }

      .app-shell {
        min-height: calc(100vh - 32px);
        border: 1px solid var(--line-strong);
        border-radius: 18px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: 292px 1fr;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, var(--sidebar-bg), #eef6ff);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .sidebar-head {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-family: 'Fira Code', monospace;
        font-weight: 700;
        letter-spacing: -0.3px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
      }

      .menu {
        display: grid;
        gap: 8px;
        padding: 14px;
      }

      .menu a {
        text-decoration: none;
        color: #114a68;
        border: 1px solid #cdddf2;
        background: linear-gradient(180deg, #ffffff, #edf5ff);
        border-radius: 11px;
        padding: 9px 12px;
        font-size: 14px;
        font-weight: 600;
        transition:
          transform 140ms ease,
          background-color 140ms ease,
          border-color 140ms ease;
      }

      .menu a:hover {
        transform: translateY(-1px);
        border-color: #9ab9dd;
      }

      .menu a.active {
        background: linear-gradient(180deg, #d1fae5, #bbf7d0);
        border-color: #86efac;
        color: #14532d;
      }

      .threads {
        border-top: 1px solid var(--line);
        padding: 14px;
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .thread-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .thread-list {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        padding: 8px;
        overflow: auto;
        min-height: 0;
      }

      .thread-empty {
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
      }

      .thread-item {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        padding: 8px;
        margin-bottom: 6px;
        cursor: pointer;
      }

      .thread-item:last-child {
        margin-bottom: 0;
      }

      .thread-item:hover {
        border-color: #d3def0;
        background: #f8fbff;
      }

      .thread-item.active {
        border-color: #9ed7cf;
        background: #ecfdf5;
      }

      .thread-title {
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 4px;
      }

      .thread-meta {
        font-size: 11px;
        color: var(--muted);
      }

      .main {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #f9fbff, #ffffff 220px);
      }

      .main-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }

      #globalStatus {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        background: #f8fafc;
      }

      #globalStatus.online {
        color: #166534;
        border-color: #86efac;
        background: #dcfce7;
      }

      #globalStatus.offline {
        color: #991b1b;
        border-color: #fecaca;
        background: #fee2e2;
      }

      .alert {
        margin: 10px 18px 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: none;
        font-size: 13px;
      }

      .alert.show {
        display: block;
      }

      .alert.danger {
        background: var(--danger-bg);
        color: var(--danger-text);
        border-color: #fecaca;
      }

      .alert.warn {
        background: var(--warn-bg);
        color: var(--warn-text);
        border-color: #fed7aa;
      }

      .content {
        margin: 10px 14px 14px;
        min-height: 0;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel-soft);
        transition:
          opacity 120ms ease,
          transform 120ms ease;
        overflow: auto;
      }

      .content.route-switching {
        opacity: 0.72;
        transform: translateY(2px);
      }

      .title {
        margin: 0;
        font-size: 20px;
        font-family: 'Fira Code', monospace;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .col {
        display: grid;
        gap: 10px;
      }

      input,
      textarea,
      button,
      select {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        font: inherit;
      }

      input,
      textarea,
      select {
        background: #ffffff;
      }

      input:focus,
      textarea:focus,
      select:focus,
      button:focus {
        outline: 2px solid #93c5fd;
        outline-offset: 1px;
      }

      button {
        cursor: pointer;
        background: linear-gradient(180deg, #f8fafc, #e2e8f0);
        color: #0f172a;
        font-weight: 600;
        border-color: #cbd5e1;
        transition:
          transform 140ms ease,
          opacity 140ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .list {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: auto;
        background: #ffffff;
      }

      .item {
        padding: 8px 10px;
        border-bottom: 1px dashed #dbe4ef;
      }

      .item:last-child {
        border-bottom: none;
      }

      .memory-chat-list {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .memory-chat-row {
        display: flex;
      }

      .memory-chat-row.user {
        justify-content: flex-end;
      }

      .memory-chat-row.model {
        justify-content: flex-start;
      }

      .memory-chat-bubble {
        max-width: min(90%, 860px);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
        background: #ffffff;
      }

      .memory-chat-bubble.user {
        background: #e6fffb;
        border-color: #93c5fd;
      }

      .memory-chat-bubble.model {
        background: #fffdf7;
        border-color: #fcd9b6;
      }

      .memory-chat-meta {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .memory-chat-content {
        white-space: normal;
        line-height: 1.45;
      }

      .memory-chat-content p {
        margin: 0 0 8px;
      }

      .memory-chat-content p:last-child {
        margin-bottom: 0;
      }

      .memory-chat-content h4 {
        margin: 10px 0 6px;
        font-size: 15px;
      }

      .memory-chat-content ul,
      .memory-chat-content ol {
        margin: 6px 0 8px 20px;
        padding: 0;
      }

      .memory-chat-content code {
        font-family: 'Fira Code', monospace;
        background: #f1f5f9;
        border: 1px solid #dbe4ef;
        border-radius: 4px;
        padding: 1px 4px;
        font-size: 12px;
      }

      .memory-chat-content pre {
        margin: 8px 0;
        border: 1px solid #dbe4ef;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        overflow: auto;
        padding: 10px;
      }

      .memory-chat-content pre code {
        background: transparent;
        border: none;
        color: inherit;
        padding: 0;
        font-size: 12px;
      }

      .memory-chat-content .md-table-wrap {
        overflow-x: auto;
        margin: 8px 0;
      }

      .memory-chat-content .md-table {
        border-collapse: collapse;
        width: 100%;
        min-width: 380px;
        font-size: 13px;
      }

      .memory-chat-content .md-table th,
      .memory-chat-content .md-table td {
        border: 1px solid #dbe4ef;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }

      .memory-chat-content .md-table th {
        background: #f8fafc;
      }

      .chat-view,
      .memory-view {
        height: 100%;
        min-height: 0;
        display: grid;
      }

      .chat-view {
        grid-template-rows: auto 1fr auto;
      }

      .chat-toolbar,
      .memory-toolbar {
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .chat-stream {
        min-height: 0;
        overflow: auto;
        padding: 4px 8px;
      }

      .chat-composer {
        border-top: 1px solid var(--line);
        background: #ffffff;
        padding: 12px;
        display: grid;
        gap: 8px;
      }

      .chat-input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .memory-view {
        grid-template-rows: auto auto 1fr;
      }

      .memory-content {
        min-height: 0;
        overflow: auto;
        padding: 4px 8px 8px;
      }

      .memory-panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #ffffff;
        min-height: 84px;
      }

      .panel-title {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: linear-gradient(180deg, #ffffff, #f8fafc);
      }

      .metric .k {
        color: var(--muted);
        font-size: 12px;
      }

      .metric .v {
        font-weight: 700;
        font-family: 'Fira Code', monospace;
        margin-top: 4px;
      }

      pre.snapshot {
        margin: 0;
        white-space: pre-wrap;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        background: #ffffff;
      }

      @media (max-width: 1000px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .threads {
          max-height: 240px;
        }

        .memory-panels,
        .grid-2,
        .grid-4 {
          grid-template-columns: 1fr;
        }

        .content {
          min-height: 74vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-head">
            <div class="brand">TeleNexus Console</div>
            <div class="muted">Chat-first local workspace</div>
          </div>

          <nav class="menu" id="menu">
            <a href="#/chat" data-route="chat">Chat</a>
            <a href="#/memory" data-route="memory">Memory</a>
            <a href="#/schedules" data-route="schedules">Schedules</a>
            <a href="#/status" data-route="status">Status</a>
          </nav>

          <section class="threads">
            <div class="thread-head">
              <strong>最近對話</strong>
              <button id="refreshThreadsBtn">刷新</button>
            </div>
            <div id="recentThreads" class="thread-list"></div>
          </section>
        </aside>

        <section class="main">
          <div class="main-head">
            <div class="muted">Web Console (hash routes)</div>
            <div id="globalStatus">connecting...</div>
          </div>

          <div id="globalAlert" class="alert"></div>
          <main id="app" class="content"></main>
        </section>
      </div>
    </div>

    <script>
      window.__APP_CONFIG__ = __APP_CONFIG_JSON__;
    </script>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
